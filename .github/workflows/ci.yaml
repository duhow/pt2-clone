name: CI Build

on:
  push:
    branches:
      - master
      - github-actions
  pull_request:

jobs:
  windows:
    name: Build on Windows
    runs-on: windows-latest
    env:
      CONFIGURATION: Release
      SOLUTION_FILE: vs2019_project/pt2-clone.sln
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Visual Studio 2019
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # tag v2.0.0
        with:
          vs-version: 16.0

      - name: Build solution in Release mode
        run: |
          msbuild ${{ env.SOLUTION_FILE }} /p:Configuration=${{ env.CONFIGURATION }} /m

      - name: Upload built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/win64

  linux:
    name: Build on Ubuntu ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["24.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    container:
      image: ubuntu:${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update and install dependencies
        run: |
          apt update
          apt install --no-install-recommends -y \
            build-essential libsdl2-dev libsdl2-dev

      - name: Build project
        run: make -j$(nproc)

      - name: Upload built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-release
          path: release/other
